<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orthodontic Financing Calculator | Monthly Payment Estimate</title>
  <meta name="description" content="Estimate monthly payments for Invisalign and braces with flexible orthodontic financing options.">
  <script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><script defer src="js/main.js"></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"Orthodontic Financing Calculator"}</script>
</head>
<body data-page="financing.html">
  <header id="site-header" class="site-header"></header>
  <main>
    <section class="hero"><img class="hero-media" src="https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=1800&q=85" alt="Financing calculator for orthodontic treatment"><div class="container-xl"><div class="max-w-3xl fade-up"><span class="eyebrow">Flexible Financing</span><h1 class="mt-5 page-title">Make your smile plan fit life.</h1><p class="mt-6 lead">A conversion-focused calculator helps patients move past cost anxiety and into a consultation.</p></div></div></section>
    <section class="section"><div class="container-xl grid-2">
      <div class="lux-card p-6 md:p-8 fade-up" data-calculator>
        <h2 class="text-3xl font-black">Payment estimator</h2>
        <div class="mt-6 grid gap-5">
          <div class="field"><label for="cost">Treatment cost</label><input id="cost" name="cost" type="range" min="2500" max="8000" value="5200"></div>
          <div class="field"><label for="down">Down payment</label><input id="down" name="down" type="range" min="0" max="2500" value="800"></div>
          <div class="field"><label for="months">Months</label><input id="months" name="months" type="range" min="12" max="36" value="24"></div>
        </div>
        <div class="mt-7 rounded-lg bg-teal-50 p-5"><p class="text-sm font-black text-teal-700">Estimated payment</p><p class="mt-2 text-4xl font-black" data-payment>$0 / mo</p></div>
      </div>
      <form class="lux-card p-6 md:p-8 form-grid crm-form fade-up" data-form="financing">
        <h2 class="text-3xl font-black">Pre-qualify request</h2>
        <div class="form-grid two"><div class="field"><label for="fin-name">Name</label><input id="fin-name" name="name" required></div><div class="field"><label for="fin-phone">Phone</label><input id="fin-phone" name="phone" required></div></div>
        <div class="field"><label for="fin-treatment">Treatment</label><select id="fin-treatment" name="treatment"><option>Invisalign</option><option>Braces</option><option>Kids orthodontics</option></select></div>
        <button class="btn-primary" type="submit">Request Financing Preview</button><p class="form-status text-sm font-bold text-teal-700" role="status"></p>
      </form>
    </div></section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
